name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Playwright smoke against next start
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  postgres:
    name: postgres-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rl_ci
          POSTGRES_PASSWORD: rl_ci
          POSTGRES_DB: rl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rl_ci -d rl_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify PostgreSQL 16 and clean database
        env:
          PGPASSWORD: rl_ci
        run: |
          psql -h 127.0.0.1 -U rl_ci -d rl_ci -v ON_ERROR_STOP=1 -c 'select version();'
          psql -h 127.0.0.1 -U rl_ci -d rl_ci -v ON_ERROR_STOP=1 -c 'drop database if exists rl_ci_migrate;'
          psql -h 127.0.0.1 -U rl_ci -d rl_ci -v ON_ERROR_STOP=1 -c 'create database rl_ci_migrate;'
          psql -h 127.0.0.1 -U rl_ci -d rl_ci_migrate -v ON_ERROR_STOP=1 -c 'select current_database(), current_schema();'

      - name: Apply migrations when W0-03 exists
        env:
          DATABASE_URL: postgresql://rl_ci:rl_ci@127.0.0.1:5432/rl_ci_migrate
        run: |
          if [ -d prisma/migrations ] && [ -n "$(ls -A prisma/migrations 2>/dev/null)" ]; then
            npx prisma migrate deploy
          else
            echo 'NOT_APPLICABLE_YET: prisma/migrations is absent (W0-03 not implemented).'
          fi

      - name: Run integration tests when present
        env:
          DATABASE_URL: postgresql://rl_ci:rl_ci@127.0.0.1:5432/rl_ci_migrate
        run: |
          if [ -d tests/integration ] && [ -n "$(ls -A tests/integration 2>/dev/null)" ]; then
            npm ci
            npx vitest run --dir tests/integration
          else
            echo 'NOT_APPLICABLE_YET: tests/integration is absent (W0-03/W0-06 not implemented).'
          fi
